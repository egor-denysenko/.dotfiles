# 10-yoga370.conf — TLP drop-in for the Lenovo ThinkPad Yoga 370 (20JJS2Y800)
#
# Install:
#   doas cp ~/.config/tlp/10-yoga370.conf /etc/tlp.d/
#   doas rc-service tlp start          # or just reboot
#
# Why a drop-in in /etc/tlp.d/ instead of editing /etc/tlp.conf
#   TLP reads its built-in defaults, then every /etc/tlp.d/*.conf in lexical
#   order, then /etc/tlp.conf last (it wins). Parking the machine-specific bits
#   in tlp.d/ leaves the packaged tlp.conf completely stock, so an `apk upgrade`
#   that rewrites it cannot silently drop or conflict with this file.
#
# Verify:
#   tlp-stat -s   status, incl. which power source TLP thinks it is on
#   tlp-stat -c   the *effective* config after merging defaults + drop-ins
#   tlp-stat -b   battery data and the charge thresholds actually in force
#   tlp-stat -g   graphics, incl. whether i915 frequency control was applied
#
# Hardware this was written against (verified on the machine):
#   CPU    Intel i3-7100U, Skylake, 2c/4t, 400 MHz..2400 MHz, no HWP
#   PSt    intel_pstate in *active* mode (governor fixed at powersave, so the
#          EPP knob below is what actually does something)
#   GPU    i915 (PCI ID 8086:5916), GT range 300..1000 MHz
#   Disk   SK hynix SC311 SATA SSD on sda
#   Net    iwlwifi/iwlmvm
#   Bat    BAT0, LGC 01AV432, 37.65 Wh of a 51 Wh design cell (73.8%),
#          226 cycles

# --- CPU ---------------------------------------------------------------------
# intel_pstate active mode: the scaling_governor is pinned to "powersave" and
# ignored, so the energy_performance_policy (EPP) setting is the real control.
# Defaults are balance_performance on AC and balance_power on battery; battery
# is pushed one step further to "power" because the cell is already worn.
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_ENERGY_PERF_POLICY_ON_SAV=power

# Turbo is the single largest battery win on this CPU, worth roughly 1-1.5 W.
# NOTE: this is silently skipped if power-profiles-daemon is running, because
# PPD owns the EPP. TLP prints a warning to the journal if you ever start it.
CPU_BOOST_ON_AC=1
# CPU_BOOST_ON_BAT=0 was WRONG on this machine and cost ~3x single-core speed.
#
# Setting no_turbo=1 makes intel_pstate recompute cpuinfo_max_freq down to
# base_frequency -- and this Yoga 370's firmware reports base_frequency as
# 800000 kHz, which is bogus for a 2.4 GHz part. Every scaling_* write is
# clamped to cpuinfo_max_freq, so the CPU_SCALING_MAX_FREQ_ON_BAT=1600000 cap
# below was silently collapsing to 800000. Measured: sustained load peaked at
# 800.24 MHz instead of the intended 1600 MHz.
#
# Keeping turbo *allowed* leaves cpuinfo_max at ~3400000, so the 1600000 cap
# applies for real. A 1600000 cap sits below base clock, so turbo stays
# unreachable on battery anyway -- identical power saving, no clamp. (On AC
# this was already observable: scaling_max_freq read 2400000 with no_turbo=0.)
#
# Revert to `CPU_BOOST_ON_BAT=0` only if you confirm cpuinfo_max_freq stays
# >=1600000 with no_turbo=1 on this box.
CPU_BOOST_ON_BAT=1
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# Ceiling on battery. Combined with turbo off and EPP=power this is a hard cap;
# raise it toward 2400000 if the machine feels too sluggish unplugged.
CPU_SCALING_MIN_FREQ_ON_AC=400000
CPU_SCALING_MAX_FREQ_ON_AC=2400000
CPU_SCALING_MIN_FREQ_ON_BAT=400000
CPU_SCALING_MAX_FREQ_ON_BAT=1600000

# --- i915 GPU ---------------------------------------------------------------
# TLP writes the card-level gt_*_freq_mhz nodes, which is what kernel 6.x
# exposes; the older per-tile rps_*_freq_mhz files are ignored. Valid range on
# this part is 300 (RPn) to 1000 (RP0) MHz.
INTEL_GPU_MIN_FREQ_ON_AC=300
INTEL_GPU_MAX_FREQ_ON_AC=1000
INTEL_GPU_BOOST_FREQ_ON_AC=1000
INTEL_GPU_MIN_FREQ_ON_BAT=300
INTEL_GPU_MAX_FREQ_ON_BAT=800
INTEL_GPU_BOOST_FREQ_ON_BAT=800

# --- Wireless ---------------------------------------------------------------
# iwlwifi's power_save is N on this machine right now, so the radio never
# sleeps. This is the cheapest ~0.3 W available and TLP's default already does
# the right thing on battery; it is listed here so `tlp-stat -c` shows it as an
# intentional choice rather than an inherited default.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# --- Audio ------------------------------------------------------------------
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# --- PCIe -------------------------------------------------------------------
# default keeps whatever the BIOS asked for, which is the sane choice on AC.
# Battery goes to the most aggressive policy TLP offers.
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave
PCIE_ASPM_ON_SAV=powersupersave

# Runtime PM is deliberately left at TLP's defaults (on=disable for AC,
# auto=enable for battery). The option names are inverted and read as a bug
# otherwise: "on" means runtime PM is *disabled*.
#
# SATA_LINKPWR is also left alone. TLP's default is med_power_with_dipm on both
# power sources, and pushing an SSD to max_power_with_dipm is where SK hynix
# SC311 drives have been reported to corrupt data. If you ever see I/O errors
# or hangs on sda, add this to a *later* drop-in rather than tuning it here:
#   SATA_LINKPWR_DENYLIST="host1"

# --- USB --------------------------------------------------------------------
USB_AUTOSUSPEND=1

# --- Battery ----------------------------------------------------------------
# This is the answer to "run it off AC without cooking the cell": stop charging
# at 80% and let it float there, resuming only at 70%. A Li-ion cell held at
# 100% and warm ages far faster than one held near half charge, and this is
# the same mechanism as Lenovo's Battery Conservation Mode in Vantage.
#
# 70/80 rather than something more aggressive on purpose. The pack is already
# down to 37.6 Wh of its 51 Wh design, so a deep-discharge buffer is worth
# keeping for when you do unplug. If you genuinely never run off mains, drop
# these to 60/70 -- TLP requires START < STOP and both within 0..99 / 1..100.
START_CHARGE_THRESH_BAT0=70
STOP_CHARGE_THRESH_BAT0=80

# TLP's default is 1, which wipes the thresholds back to 0..100 the instant the
# charger is pulled so the cell behaves like a normal laptop battery. Set to 0
# to keep the ceiling in force regardless of power state, which is what "AC
# only" actually needs.
RESTORE_THRESHOLDS_ON_BAT=0
