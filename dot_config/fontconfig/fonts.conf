<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Make Departure Mono the system default so GTK/Qt apps (firefox chrome, rofi,
  pavucontrol, ...) pick it up, not just the things that name a font explicitly.

  Every <prefer> list keeps the generic fallbacks after Departure Mono. This
  repo is deployed to several machines and Departure Mono is only installed
  where someone dropped the font into ~/.local/share/fonts — fontconfig
  silently skips a family it cannot resolve, so a machine without it still
  resolves Noto Sans Mono / DejaVu and nothing breaks. Do not trim these
  without checking the other machines.

  `serif` is deliberately NOT remapped: Departure Mono is monospace, so
  pointing serif at it turns every web page into pixel-monospace body text.
  Add an alias for it here if that is actually what you want.
-->
<fontconfig>

  <!-- Code, terminals, anything that asks for a fixed-width face. -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>DepartureMono Nerd Font</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <alias>
    <family>fixed</family>
    <prefer>
      <family>DepartureMono Nerd Font</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <!-- Application chrome: browser UI, menus, rofi, GTK default.

       sans-serif needs a <match> rule rather than an <alias>: the distro's
       60-latin.conf also aliases sans-serif, and when two aliases collide
       fontconfig keeps 60-latin's list first — the alias below was silently
       ignored and fc-match still returned DejaVu Sans. A <match> with an
       explicit assign wins over alias merging.

       Heads up: this is also what web page body text falls back to in a lot of
       apps, so browsing starts looking like pixel-monospace. Comment this block
       out if you only want app chrome (system-ui above covers that). -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>DepartureMono Nerd Font</string>
    </edit>
  </match>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>DepartureMono Nerd Font</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

</fontconfig>
