# Run the daemon on the Vulkan binary (AMD iGPU, RADV) instead of the AVX2 CPU
# one. The /usr/bin/voxtype dispatcher script honors VOXTYPE_GPU=1, so this
# needs no root and no symlink swap. Measured ~6x faster than voxtype-avx2
# on this machine. Remove this drop-in to go back to the CPU binary.
[Service]
Environment=VOXTYPE_GPU=1
