# Vendored from Fedora /usr/share/sway/config.d/50-rules-pavucontrol.conf — edit here, re-diff against the original when re-vendoring.
# Tile the volume control application (both GTK and Qt varieties)
# like other applications, without covering the workspace.

for_window [app_id="^(org\.pulseaudio\.)?pavucontrol$"] {
    floating disable
}

for_window [app_id="pavucontrol-qt"] {
    floating disable
}
