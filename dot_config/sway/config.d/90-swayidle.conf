# Idle configuration — locks after 5 min of inactivity, blanks the screens
# after 10 min, turns them back on when resumed, and locks before sleep.
#
# Same basename as Fedora's /usr/share/sway/config.d/90-swayidle.conf: the
# layered include in ../config lets this file replace the distro's, so only
# ONE swayidle instance runs. Distro snippets also read $lock_timeout /
# $screen_timeout — ours uses fixed values on purpose.
#
# Requires: swayidle, swaylock
exec swayidle -w \
         timeout 300 'swaylock -f -c 000000' \
         timeout 600 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
         before-sleep 'swaylock -f -c 000000'
