# Local push-to-talk dictation. Managed with chezmoi.
# Hold Super+Shift+V to record; release all three keys to transcribe and type.
# Voxtype's evdev hotkey is disabled in ~/.config/voxtype/config.toml.
bindsym --no-repeat $mod+Shift+v exec /usr/bin/voxtype record start
bindsym --release $mod+Shift+v exec /usr/bin/voxtype record stop
