# Start graphical authentication agent for PolicyKit.
#
# Certain applications may require this to request elevated privileges:
#   GParted, virt-manager, anything that uses pkexec
#
# Requires: lxqt-policykit or polkit-gnome (skipped when neither is installed)
#
# Vendored from Fedora /usr/share/sway/config.d/95-autostart-policykit-agent.conf
# — the hardcoded Fedora path replaced with a search over common locations.
exec sh -c 'for a in "$(command -v lxqt-policykit-agent)" /usr/libexec/lxqt-policykit-agent /usr/lib/lxqt/lxqt-policykit-agent /usr/libexec/polkit-gnome-authentication-agent-1 /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1; do [ -n "$a" ] && [ -x "$a" ] && exec "$a"; done'
