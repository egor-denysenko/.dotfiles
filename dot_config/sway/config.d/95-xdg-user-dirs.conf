# Create or update XDG user dir configuration
#
# See also:
#  - /etc/xdg/autostart/xdg-user-dirs.desktop
#  - https://github.com/systemd/systemd/issues/18791
#
# Recommends: xdg-user-dirs (skipped when not installed)
#
# Vendored from Fedora /usr/share/sway/config.d/95-xdg-user-dirs.conf — absolute
# path replaced with a command lookup.
exec sh -c 'command -v xdg-user-dirs-update >/dev/null && xdg-user-dirs-update'
