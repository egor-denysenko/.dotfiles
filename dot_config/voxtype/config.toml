# Local Sway dictation. No cloud endpoint or post-processing command.
engine = "whisper"
state_file = "auto"

[hotkey]
# Sway handles press/release; no evdev or input-group access.
enabled = false

[audio]
# ALSA default routes through PipeWire and follows its default microphone.
device = "default"
sample_rate = 16000
max_duration_secs = 60

[whisper]
mode = "local"
model = "large-v3-turbo"
# Keep the smaller models on hand for a fast path:
#   voxtype record start --model small
available_models = ["small", "small.en", "base.en"]
# Pinned to English: auto-detect cost time and misfired (e.g. "az" at p=0.01).
# language = "en"
# Constrained auto-detect between the two languages actually spoken; much
# cheaper and more reliable on short clips than open "auto" over ~99 languages.
# Pinning with Super+Shift+l (voxtype-lang) skips the detection pass entirely.
language = "en"
translate = false
# Off: the docs warn large-v3-turbo can repeat phrases with the shortened
# window, and it also dropped capitalisation in testing. It only helps clips
# under 22.5 s anyway. Re-enable if latency ever matters more than polish.
context_window_optimization = false
threads = 8
# Keep the primary model loaded for responsive dictation.
on_demand_loading = false

[output]
mode = "type"
# Explicitly exclude uinput/evdev-based typing drivers.
driver_order = ["wtype", "clipboard"]
type_delay_ms = 0
pre_type_delay_ms = 200
auto_submit = false
# This feature requires evdev access; release all shortcut keys instead.
wait_for_modifier_release = false

[output.notification]
on_recording_start = true
on_recording_stop = true
# Do not expose dictated text in desktop notification history.
on_transcription = false

[osd]
# Keep the initial setup minimal; notifications indicate recording state.
enabled = false
