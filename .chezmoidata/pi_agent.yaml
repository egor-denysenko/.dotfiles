# Machine-specific Pi agent settings.
# Shared settings stay in dot_config/pi/agent/settings.json.tmpl.

pi_agent:
  machine_profiles:
    personal:
      defaultProvider: nvidia-nim
      defaultModel: moonshotai/kimi-k2.6
      enabledModels:
        - glm-5.2
        - minimax-m3
      packages:
        # Pinned to commit hash — update by reviewing upstream and replacing the SHA.
        - git:github.com/egor-denysenko/pi-nvidia-nim@49ea9520525ac347947cdac94bcec400339a6708
        # Voice dictation (on-device Whisper STT) + i18n — pinned to npm versions.
        - npm:@juicesharp/rpiv-voice@1.19.1
        - npm:@juicesharp/rpiv-i18n@1.19.1
        # Async subagent delegation — pinned to commit hash.
        - git:github.com/nicobailon/pi-subagents@efa7120047eaf76a32620eed0ec7d038b6cfa44e

    work:
      defaultProvider: lmstudio
      defaultModel: google/gemma-4-12b-qat
      enabledModels:
        - google/gemma-4-12b-qat
      packages:
        # Voice dictation (on-device Whisper STT) + i18n — pinned to npm versions.
        - npm:@juicesharp/rpiv-voice@1.19.1
        - npm:@juicesharp/rpiv-i18n@1.19.1
        # Async subagent delegation — pinned to commit hash.
        - git:github.com/nicobailon/pi-subagents@efa7120047eaf76a32620eed0ec7d038b6cfa44e
