# Machine-specific Pi agent settings.
# Shared settings stay in dot_config/pi/agent/settings.json.tmpl.

pi_agent:
  machine_profiles:
    personal: &default_profile
      packages:
        # Voice dictation (on-device Whisper STT) + i18n — pinned to npm versions.
        - npm:@juicesharp/rpiv-voice@2.7.1
        - npm:@juicesharp/rpiv-i18n@2.7.1
        # Async subagent delegation.
        - git:github.com/nicobailon/pi-subagents@0.58.0
        # FFF file search — frecency-ranked grep/find for pi.
        - npm:@ff-labs/pi-fff@0.10.5
        # LSP diagnostics & language server navigation tools — 0.1.7 is latest.
        - npm:pi-lsp@0.1.7
        # Neovim line-based review comments for Pi — pinned to commit hash (no tags).
        - git:github.com/jillesme/pi-nvim-review@d61a694dcd38

    work:
      <<: *default_profile
